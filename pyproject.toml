[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet-parser"
version = "0.1.0"
description = "Extract pin data from electronic component datasheets and generate 3D CAD models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["datasheet", "electronics", "cad", "3d-modeling", "pinout"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

# Every package below is hard-imported by src/ — none are optional.
dependencies = [
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "cadquery>=2.4.0",
    "Pillow>=10.0.0",
    "pygltflib>=1.16.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "nest_asyncio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
datasheet-parser = "src.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/datasheet-parser"
Documentation = "https://github.com/yourusername/datasheet-parser#readme"
Repository = "https://github.com/yourusername/datasheet-parser.git"
Issues = "https://github.com/yourusername/datasheet-parser/issues"

# The code imports as `src.*` (python -m src.main), so `src` itself is the
# package — find it at the repo root, not inside it.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "integration: tests that load real PDF files or generate real GLB output (slower)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
