name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pdfplumber \
            PyMuPDF \
            pygltflib \
            trimesh \
            numpy \
            openai \
            python-dotenv \
            nest_asyncio \
            pytest \
            pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/test_suite.py -v -m "not integration" --tb=short

      - name: Coverage report
        run: |
          python -m pytest tests/test_suite.py -m "not integration" \
            --cov=src --cov-report=term-missing --tb=short -q
